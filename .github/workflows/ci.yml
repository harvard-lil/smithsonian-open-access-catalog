name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  ECR_REPOSITORY: smithsonian-open-access-catalog

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: 0.12.14
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest

  image:
    needs: test
    runs-on: ubuntu-latest
    env:
      PUSH: ${{ github.event_name != 'pull_request' && github.repository == 'harvard-lil/smithsonian-open-access-catalog' }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - if: env.PUSH == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::915821419033:role/smithsonian-open-access-catalog-github-oidc
          aws-region: us-west-2
      - if: env.PUSH == 'true'
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - id: tags
        run: |
          if [ "$PUSH" = "true" ]; then
            registry="${{ steps.ecr.outputs.registry }}"
            echo "tags=${registry}/${ECR_REPOSITORY}:${GITHUB_SHA},${registry}/${ECR_REPOSITORY}:latest" >> "$GITHUB_OUTPUT"
          else
            echo "tags=${ECR_REPOSITORY}:pr" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: ${{ env.PUSH == 'true' }}
          provenance: false
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
